services:
  mcp:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:?Set MCP_HTTP_ALLOWED_HOSTS in .env}
      MOBILITEIT_POLL_INTERVAL_SECONDS: ${MOBILITEIT_POLL_INTERVAL_SECONDS:-30}
      MOBILITEIT_MAX_ACTIVE_FEEDS: ${MOBILITEIT_MAX_ACTIVE_FEEDS:-1}
      MOBILITEIT_MAX_REQUESTS_PER_MINUTE: ${MOBILITEIT_MAX_REQUESTS_PER_MINUTE:-60}
      MCP_HTTP_SESSION_IDLE_TIMEOUT_SECONDS: ${MCP_HTTP_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      MCP_HTTP_MAX_SESSIONS: ${MCP_HTTP_MAX_SESSIONS:-100}
      MOBILITEIT_API_KEY_FILE: /run/secrets/mobiliteit_api_key
      MCP_HTTP_BEARER_TOKEN_FILE: /run/secrets/mcp_http_bearer_token
    secrets:
      - mobiliteit_api_key
      - mcp_http_bearer_token
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcp:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:

secrets:
  mobiliteit_api_key:
    file: ./secrets/mobiliteit_api_key
  mcp_http_bearer_token:
    file: ./secrets/mcp_http_bearer_token
